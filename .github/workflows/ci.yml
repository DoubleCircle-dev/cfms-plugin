name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run toolchain tests
        run: npm test

      - name: Generate ephemeral publisher key
        run: node tools/keygen.mjs --id ci-publisher --publisher --force

      - name: Generate fixture plugins
        run: |
          node tools/new-plugin.mjs com.example.ci-a --dir .tmp/plugins/ci-a
          node tools/new-plugin.mjs com.example.ci-b --dir .tmp/plugins/ci-b

      - name: Build all plugins with catalog
        run: |
          node tools/build.mjs --plugins .tmp/plugins --out .tmp/dist \
            --base-url https://example.github.io/cfms-plugin/releases/download/plugins

      - name: Verify packages and catalog
        run: |
          node tools/verify.mjs .tmp/dist/*.cfmsext
          node tools/catalog.mjs verify .tmp/dist/catalog/catalog.json

      - name: Publish dry-run
        run: |
          node tools/publish.mjs --plugins .tmp/plugins --out .tmp/dist --dry-run \
            --repo example/cfms-plugin
